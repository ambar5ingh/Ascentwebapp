name: Build and deploy ASCENT web app

on:
  push:
    branches: [main, master]
    paths: ['excel/**', 'site/**', 'tools/**', 'test/**', '.github/workflows/**']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install extractor dependencies
        run: pip install -r tools/requirements.txt

      - name: Extract the workbook (cells, styles, formulas, shapes, charts)
        run: python tools/extract.py excel/*.xlsm build/raw

      - name: Build app data and dependency graph
        run: node --max-old-space-size=6000 tools/build.mjs build/raw site/data

      - name: Check the formula engine against Excel's saved results
        run: node --max-old-space-size=6000 test/verify.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
